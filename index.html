<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Almoxarifado</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Controle de Almoxarifado</h1>

        <div class="dashboard">
            <h3>Total de Materiais:</h3>
            <p id="total-itens">0</p>
        </div>

        <input
            type="text"
            id="input-busca"
            placeholder="Pesquisar material..."
        >

        <br><br>

        <input
            type="text"
            id="input-nome"
            placeholder="Nome do material"
        >

        <input
            type="number"
            id="input-quantidade"
            placeholder="Quantidade"
        >

        <input
            type="number"
            id="input-retirada"
            placeholder="Quantidade para retirar"
        >

        <button id="btn-cadastrar">
            Cadastrar
        </button>

        <hr>

        <table>
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="lista-materiais">
            </tbody>
        </table>

        <div id="feedback"></div>

    </div>

    <script src="main.js"></script>

</body>
</html>
